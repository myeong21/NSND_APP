<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; }
  html, body, #map { width: 100%; height: 100%; overflow: hidden; }
</style>
</head>
<body>
<div id="map"></div>
<script>
window.onerror = function(msg, url, line, col, error) {
    console.error("Window Error: " + msg + " at " + url + ":" + line);
    return false;
};
</script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=KAKAO_JS_KEY&autoload=false"
        onerror="console.error('Kakao Maps SDK script load failed');"></script>
<script>
var map = null;
var markers = [];
var infowindow = null;

function initMap() {
    console.log("initMap called, kakao defined?", typeof kakao !== 'undefined');
    if (typeof kakao === 'undefined' || !kakao.maps) {
        console.error("Kakao SDK not loaded yet");
        return;
    }
    kakao.maps.load(function() {
        console.log("kakao.maps.load callback triggered");
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(37.402056, 127.108212),
            level: 5
        };
        map = new kakao.maps.Map(container, options);
        infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

        // Android에 맵 준비 완료 알림
        if (window.AndroidBridge) {
            window.AndroidBridge.onMapReady();
        }
    });
}

window.addEventListener('DOMContentLoaded', initMap);

function clearMarkers() {
    for (var i = 0; i < markers.length; i++) {
        markers[i].setMap(null);
    }
    markers = [];
    if (infowindow) infowindow.close();
}

function addMarker(lat, lng, level, time) {
    if (!map) return;

    var colorMap = { 1: '#FFCA28', 2: '#FF9800', 3: '#F44336' };
    var labelMap = { 1: '주의', 2: '경고', 3: '위험' };
    var color = colorMap[level] || '#FFCA28';
    var label = labelMap[level] || '주의';

    var markerSize = level === 3 ? 18 : (level === 2 ? 15 : 13);

    // SVG 마커 이미지 생성
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + (markerSize*2) + '" height="' + (markerSize*2) + '">' +
              '<circle cx="' + markerSize + '" cy="' + markerSize + '" r="' + (markerSize-2) + '" fill="' + color + '" stroke="white" stroke-width="2" opacity="0.9"/>' +
              '<text x="' + markerSize + '" y="' + (markerSize+4) + '" text-anchor="middle" font-size="10" font-weight="bold" fill="white">' + level + '</text>' +
              '</svg>';

    var imageSrc = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    var imageSize = new kakao.maps.Size(markerSize*2, markerSize*2);
    var imageOption = { offset: new kakao.maps.Point(markerSize, markerSize) };
    var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption);

    var position = new kakao.maps.LatLng(lat, lng);
    var marker = new kakao.maps.Marker({
        map: map,
        position: position,
        image: markerImage
    });

    var infoContent = '<div style="padding:5px 10px;font-size:12px;white-space:nowrap;background:#222;color:#fff;border-radius:6px;">' +
                      level + '단계(' + label + ') ' + time + '</div>';

    kakao.maps.event.addListener(marker, 'click', function() {
        infowindow.setContent(infoContent);
        infowindow.open(map, marker);
        if (window.AndroidBridge && typeof window.AndroidBridge.onMarkerClick === 'function') {
            window.AndroidBridge.onMarkerClick(level, time, lat, lng);
        }
    });

    markers.push(marker);
}

function moveCamera(lat, lng, level) {
    if (!map) return;
    var moveLatLng = new kakao.maps.LatLng(lat, lng);
    map.setCenter(moveLatLng);
    map.setLevel(level || 5);
}

function fitBounds() {
    if (!map || markers.length === 0) return;
    var bounds = new kakao.maps.LatLngBounds();
    for (var i = 0; i < markers.length; i++) {
        bounds.extend(markers[i].getPosition());
    }
    map.setBounds(bounds, 50, 50, 50, 50);
}
</script>
</body>
</html>
